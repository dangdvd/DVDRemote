# Builds installable app packages (Android APK/AAB, unsigned iOS IPA).
# On pull requests the packages are attached to the run as downloadable artifacts; on a version
# tag or a manual run they are also published as a GitHub Release.
#
# Start a release by pushing a version tag:
#   git tag v1.0.0 && git push origin v1.0.0
# or run it manually from the Actions tab (workflow_dispatch) with a version.
#
# Optional repository secrets for a proper Android signing key (otherwise the APK is signed
# with the public debug key: installable, but not suitable for Google Play):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Build & Release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản (VD: 1.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Empty on pull requests: the version in app.json is used as is.
  VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Set version
        run: |
          if [ -n "$VERSION" ]; then node scripts/set-version.js "$VERSION"; fi
          echo "APP_VERSION=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_ENV"
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with the debug key"
          fi
      - name: Build APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Collect files
        run: |
          V="$APP_VERSION"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/DVDRemote-$V.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/DVDRemote-$V.aab"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: DVDRemote-android
          path: dist/*
          if-no-files-found: error

  ios:
    needs: test
    # Expo SDK 58 builds its ExpoModulesJSI framework with Swift 6 during the app build and is
    # developed against Xcode 27; Xcode 26.x rejects it ("sending 'slot' risks causing data races").
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: List installed Xcode versions
        run: ls -d /Applications/Xcode*.app
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'
      - run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        run: |
          if [ -n "$VERSION" ]; then node scripts/set-version.js "$VERSION"; fi
          echo "APP_VERSION=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_ENV"
      - name: Generate native project
        run: npx expo prebuild --platform ios
      - name: Build unsigned IPA
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          V="$APP_VERSION"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" ../dist
          cp -R "$RUNNER_TEMP/app.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/DVDRemote-$V-unsigned.ipa" Payload)
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: DVDRemote-ios-ipa
          path: dist/*
          if-no-files-found: error

  release:
    # iOS is best effort: publish the Android build even if the iOS build fails.
    needs: [android, ios]
    if: ${{ !cancelled() && needs.android.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes
        run: |
          V="${VERSION#v}"
          echo "TAG=v$V" >> "$GITHUB_ENV"
          IOS_NOTE="- **iPhone**: \`DVDRemote-$V-unsigned.ipa\` là bản **chưa ký**. Cài bằng AltStore, Sideloadly hoặc TrollStore (công cụ sẽ ký bằng Apple ID của bạn). Để phát hành qua App Store/TestFlight cần tài khoản Apple Developer và \`eas build\`/\`eas submit\`."
          if ! ls dist/*.ipa >/dev/null 2>&1; then
            IOS_NOTE="- **iPhone**: bản iOS chưa build được trong lần phát hành này. Có thể build bằng \`npx eas-cli build --platform ios\`."
          fi
          cat > notes.md <<NOTES
          ## Cài đặt

          - **Android**: tải \`DVDRemote-$V.apk\` về điện thoại, mở file và cho phép *Cài ứng dụng không rõ nguồn gốc*. File \`.aab\` dùng để đăng lên Google Play.
          $IOS_NOTE

          Điện thoại và TV cần dùng chung mạng Wi-Fi. Hướng dẫn sử dụng chi tiết xem trong README.

          ## Kiểm tra tính toàn vẹn (SHA-256)

          \`\`\`
          $(cd dist && sha256sum *)
          \`\`\`
          NOTES
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: DVD Remote ${{ env.TAG }}
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
