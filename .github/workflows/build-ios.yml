# Builds the unsigned iOS IPA and uploads it as the "DVDRemote-ios-ipa" artifact.
# Called by release.yml, which retries it when GitHub cancels the job while it waits for a
# macOS runner.
name: Build iOS

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (v1.2.3, 1.2.3) or empty to keep app.json'
        type: string
        default: ''

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    # Expo SDK 58 builds its ExpoModulesJSI framework with Swift 6 during the app build. Xcode 26.3
    # (Swift 6.2, latest-stable on macos-15) rejects it ("sending 'slot' risks causing data races"),
    # so use the newest Xcode of the macos-26 image.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: List installed Xcode versions
        run: ls -d /Applications/Xcode*.app
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        run: |
          if [ -n "$VERSION" ]; then node scripts/set-version.js "$VERSION"; fi
          echo "APP_VERSION=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_ENV"
      - name: Generate native project
        run: npx expo prebuild --platform ios
      - name: Build unsigned IPA
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          V="$APP_VERSION"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" ../dist
          cp -R "$RUNNER_TEMP/app.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/DVDRemote-$V-unsigned.ipa" Payload)
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: DVDRemote-ios-ipa
          path: dist/*
          if-no-files-found: error
